name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # Every `uses:` line below is pinned to a commit SHA (estate law —
  # M-SHARED-36): actions/checkout@… = v7.0.1, setup-php@… = v2.40.0,
  # codecov@… = v7.1.1, codacy@… = v1.3.0. Do not float any of them
  # back to a moving tag.
  composer-validate:
    name: Composer Validation
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP
        uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60
        with:
          php-version: '8.3'

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

  # PHP-version matrix law (M-SHARED-35): composer.json declares `php: ^8.3`
  # (8.4 included) and both consumers run 8.4 CI legs, so the suite and the
  # code-parsing gates run on every supported version instead of a
  # single-version assumption. composer-validate and composer-audit stay
  # 8.3-only on purpose: they operate on version-independent lock corpora.
  # The psalm gate is in the matrix too since the vimeo/psalm 6.x upgrade
  # (6.5.0 declares `~8.3.0 || ~8.4.0`; the old locked 5.26.1 had a `~8.3.0`
  # ceiling that forced `--ignore-platform-req=php` on the 8.4 legs). A plain
  # `composer install` now resolves the lock on both legs. PHP 8.5 is NOT in
  # the matrix: psalm 6.5 has no 8.5 support, so the lock would be rejected.
  phpcs:
    name: "PHP CodeSniffer (PSR-12) — PHP ${{ matrix.php }}"
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP
        uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60
        with:
          php-version: ${{ matrix.php }}
          extensions: json

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      # 2026-10-02 CI-gate audit — the `-n` that used to sit in this command
      # suppressed warnings from BOTH the report and the exit math, and tests/
      # was not gated at all. src/ measures 0 errors / 0 warnings under full
      # PSR-12 (measured at 1880888), so this invocation is strict: errors AND
      # warnings fail, exit code read directly by the runner. Do NOT re-add
      # `-n`, do NOT add phpcs:ignore inline suppressions, do not grep the log
      # for a totals line (the default `full` report never prints one) — fix
      # the code instead.
      - name: Run PHPCS (src/, strict PSR-12)
        run: ./vendor/bin/phpcs --standard=PSR12 --colors src/

      # Additive tests/ gate (mirrors phlix-server coding-standards.yml). THE
      # GATE IS phpcs's NONZERO EXIT CODE: errors exit non-zero; the 28
      # pre-existing LineLength warnings stay printed in the log and are
      # neutralized in the exit math ONLY by the documented
      # ignore_warnings_on_exit config inside phpcs-tests.xml — never by `-n`,
      # never by `|| true`. Every exclusion in that ruleset carries its own
      # measurement and classification.
      - name: Run PHPCS on tests/ (PSR-12 minus two documented test-idiom sniffs)
        run: ./vendor/bin/phpcs --standard=phpcs-tests.xml --colors

  phpstan:
    name: "PHPStan Static Analysis — PHP ${{ matrix.php }}"
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP
        uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60
        with:
          php-version: ${{ matrix.php }}
          extensions: json

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyze --no-progress --error-format=github

  psalm:
    name: "Psalm Static Analysis — PHP ${{ matrix.php }}"
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP
        uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60
        with:
          php-version: ${{ matrix.php }}
          extensions: json

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Psalm
        run: ./vendor/bin/psalm --no-progress --show-info=false

  phpunit:
    name: "PHPUnit Test Suite — PHP ${{ matrix.php }}"
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP
        uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: xdebug

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit --colors=always

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          files: ./coverage.xml
          flags: phpunit
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699
        continue-on-error: true
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          coverage-reports: ./coverage.xml

  composer-audit:
    name: Security Audit
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP
        uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60
        with:
          php-version: '8.3'

      # S246 — this job ran `composer install ... --no-dev` followed by a bare
      # `composer audit --no-dev`, which excluded every development dependency
      # from the audited set. It therefore reported SUCCESS on 2026-08-06
      # against a lock pinning squizlabs/php_codesniffer 3.13.5, which
      # CVE-2026-67434 (HIGH, OS command injection) had just made vulnerable.
      #
      # The replacement audits the WHOLE lock and prints the corpus it examined.
      # `--locked` needs no vendor/, so the install step is gone with it. Read
      # scripts/security-audit-check.php for the policy and its reasoning.
      #
      # Do NOT re-introduce the development-dependency exclusion, do NOT add
      # continue-on-error to the step below, and do NOT wrap it in a
      # conditional: tests/Support/SecurityAuditCheckTest.php parses this file and fails on each of those
      # edits. Keep composer-audit the LAST job in this file.
      - name: Run Security Audit (runtime AND development dependencies)
        run: php scripts/security-audit-check.php
